[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenbuddy-host"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.115.12", "uvicorn==0.34.2", "pyserial==3.5", "psutil==7.0.0"]

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[project.scripts]
tokenbuddy = "tokenbuddy.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tokenbuddy*"]
